# Kind cluster configuration for KubeNetLLM experiments
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubenet-test

# Cluster networking configuration
networking:
  # Disable default CNI to test different CNI plugins
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  
  # Enable API server on specific port
  apiServerPort: 6443

# Node configuration
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.31.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Istio ingress gateway
      - containerPort: 15021
        hostPort: 15021
        protocol: TCP
    extraMounts:
      # Mount local data directory for testing
      - hostPath: ./data
        containerPath: /data
        readOnly: false
  
  # Worker nodes for multi-node testing
  - role: worker
    image: kindest/node:v1.31.0
    
  - role: worker
    image: kindest/node:v1.31.0

# Feature gates for testing
featureGates:
  NetworkPolicyPort: true
  ProxyTerminatingEndpoints: true

# Container runtime configuration
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://localhost:5000"] 